<!-- inference/templates/login.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .card { max-width: 400px; margin: 50px auto; border-radius: 1rem; padding: 30px; }
    h2 { text-align: center; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="card shadow-sm">
  <h2>🔐 Login</h2>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-2"><label>Username</label><input type="text" name="username" class="form-control" required></div>
    <div class="mb-2"><label>Password</label><input type="password" name="password" class="form-control" required></div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 text-center">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>

</body>
</html>
