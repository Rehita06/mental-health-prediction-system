<!-- inference/templates/admin_dashboard.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .card { max-width: 500px; margin: 50px auto; border-radius: 1rem; padding: 30px; }
    h2 { text-align: center; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="card shadow-sm">
  <h2>🔑 Sign Up</h2>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-2"><label>Username</label><input type="text" name="username" class="form-control" required></div>
    <div class="mb-2"><label>Phone Number</label><input type="text" name="phone" class="form-control" required></div>
    <div class="mb-2"><label>Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="mb-2"><label>Password</label><input type="password" name="password" class="form-control" required></div>
    <div class="mb-2"><label>Age</label><input type="number" name="age" class="form-control"></div>
    <div class="mb-2">
      <label>Gender</label>
      <select class="form-select" name="gender">
        <option value="">Select...</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>
    <div class="mb-2"><label>designation </label><input type="text" name="designation" class="form-control"></div>
    <div class="mb-2"><label>Company</label><input type="text" name="company" class="form-control"></div>

    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
  </form>
  <p class="mt-3 text-center">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>

</body>
</html>
